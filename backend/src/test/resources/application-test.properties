spring.application.name=spatialstay-backend-test

spring.datasource.url=jdbc:postgresql://localhost:5432/spatialstay_test_db
spring.datasource.username=postgres
spring.datasource.password=${SPATIALSTAY_DB_PASSWORD}

# Tests own this database, so rebuilding the schema is intentional.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# Do not load development fixture data into security tests.
spring.sql.init.mode=never

# Session configuration mirrors the application.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false

# Test frontend used by CORS/OAuth configuration.
app.frontend-url=http://localhost:3000

# Never expose raw security tokens unless a particular test
# explicitly overrides this property.
app.auth.expose-development-tokens=false

# OAuth registration must remain syntactically configured so
# Spring can construct the security configuration during tests.
spring.security.oauth2.client.registration.google.client-id=test-google-client
spring.security.oauth2.client.registration.google.client-secret=test-google-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# AI is not required for Step 6 security integration tests.
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.embedding.text=none
spring.ai.vectorstore.type=none

spring.autoconfigure.exclude=org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration

app.ai.enabled=false

# =========================================================
# SpatialStay
# =========================================================

spring.application.name=spatialstay-backend

server.port=8080


# =========================================================
# PostgreSQL
# =========================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/spatialstay_db
spring.datasource.username=postgres
spring.datasource.password=${SPATIALSTAY_DB_PASSWORD}


# =========================================================
# JPA / Hibernate
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true


# =========================================================
# Session Security
# =========================================================

server.servlet.session.timeout=30m

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Must be true in production HTTPS.
server.servlet.session.cookie.secure=${SPATIALSTAY_SECURE_COOKIE:false}


# =========================================================
# Google Authentication
# =========================================================

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}

spring.security.oauth2.client.registration.google.scope=openid,profile,email


# =========================================================
# SpatialStay Frontend
# =========================================================

app.frontend-url=${SPATIALSTAY_FRONTEND_URL:http://localhost:3000}


# =========================================================
# Authentication Development Settings
# =========================================================

# Development only.
# Must be false in production.
app.auth.expose-development-tokens=${SPATIALSTAY_EXPOSE_DEV_TOKENS:true}


# =========================================================
# SpatialStay AI
# =========================================================

app.ai.enabled=${SPATIALSTAY_AI_ENABLED:true}


# =========================================================
# AI - Chat Provider
# Groq / Qwen
# =========================================================

# SpatialStay creates the Groq chat model explicitly
# inside AiProviderConfig.
#
# Google Gemini is no longer used for chat.
# Google is retained only for RAG embeddings.

spring.ai.model.chat=none

# Disable unused model capabilities.
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.image=none
spring.ai.model.moderation=none

app.ai.groq.api-key=${GROQ_API_KEY}

app.ai.groq.base-url=${SPATIALSTAY_GROQ_BASE_URL:https://api.groq.com/openai/v1}

app.ai.groq.model=${SPATIALSTAY_GROQ_MODEL:qwen/qwen3.8-27b}


# =========================================================
# AI - Conversation Context Limits
# =========================================================

# Keep voice/chat context compact for lower latency.
# Authoritative hotel/room facts still come from tools.

app.ai.history.max-messages=${SPATIALSTAY_AI_HISTORY_MAX_MESSAGES:6}

app.ai.history.max-message-chars=${SPATIALSTAY_AI_HISTORY_MAX_MESSAGE_CHARS:800}


# =========================================================
# AI - Embedding Selection
# =========================================================

# Do not create an OpenAI embedding model.
spring.ai.model.embedding=none

# RAG embeddings remain on Google GenAI.
spring.ai.model.embedding.text=google-genai


# =========================================================
# RAG - Gemini Embeddings
# =========================================================

# Gemini is retained only for embedding/RAG functionality.

spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}

spring.ai.google.genai.embedding.text.model=gemini-embedding-001

spring.ai.google.genai.embedding.text.dimensions=768


# =========================================================
# RAG - PostgreSQL / pgvector
# =========================================================

spring.ai.vectorstore.type=pgvector

spring.ai.vectorstore.pgvector.initialize-schema=true

spring.ai.vectorstore.pgvector.schema-name=public

spring.ai.vectorstore.pgvector.table-name=hotel_knowledge_vectors

spring.ai.vectorstore.pgvector.dimensions=768

spring.ai.vectorstore.pgvector.schema-validation=true


# =========================================================
# RAG - SpatialStay
# =========================================================

app.rag.enabled=${SPATIALSTAY_RAG_ENABLED:true}

# Keep false unless development knowledge intentionally
# needs to be seeded again.
app.rag.seed-development-data=${SPATIALSTAY_RAG_SEED_DEV_DATA:false}


# =========================================================
# Internal LiveKit Voice Bridge
# =========================================================

app.ai.voice.internal-key=${SPATIALSTAY_VOICE_INTERNAL_KEY:}


# =========================================================
# Booking / Inventory Hold
# =========================================================

# Customers have 10 minutes to continue from an inventory
# hold before the held room inventory becomes available again.
spatialstay.booking.hold-duration=PT10M

# Normalize expired ACTIVE hold rows once per minute.
# Availability correctness does not depend on this scheduler.
spatialstay.booking.hold-expiration-scan-ms=60000


# ============================================================
# Razorpay
# ============================================================

spatialstay.payment.razorpay.key-id=${RAZORPAY_KEY_ID:}
spatialstay.payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

spatialstay.payment.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}


spatialstay.payment.reconciliation.discovery-enabled=false
spatialstay.payment.reconciliation.discovery-scan-ms=120000